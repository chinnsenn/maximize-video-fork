name: Publish Greasy Fork Branch

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Userscript version override, for example 1.0.1"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Resolve userscript version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$version" ]; then
            echo "USERSCRIPT_VERSION=$version" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: maximize-video-fork
          path: dist/maximize-video-fork.user.js
      - name: Push Greasy Fork sync branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_BRANCH: greasyfork
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cp dist/maximize-video-fork.user.js "$workdir/maximize-video-fork.user.js"
          printf '%s\n' \
            '# Greasy Fork build output' \
            '' \
            'This branch is generated by GitHub Actions.' \
            'Greasy Fork should sync maximize-video-fork.user.js from this branch.' \
            > "$workdir/README.md"
          cd "$workdir"
          git init
          git checkout -b "$PUBLISH_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maximize-video-fork.user.js README.md
          git commit -m "Publish Greasy Fork build ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$PUBLISH_BRANCH"
